[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:desktop-session]
command=/usr/local/sbin/run-cos-session
user=cos
environment=HOME="/home/cos",USER="cos",LOGNAME="cos",SHELL="/bin/bash",CHROME_REMOTE_DESKTOP_USE_XVFB="1",LIBGL_ALWAYS_SOFTWARE="1"
priority=20
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/local/sbin/run-cos-x11vnc
user=cos
environment=HOME="/home/cos",USER="cos",LOGNAME="cos",SHELL="/bin/bash"
priority=30
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/local/sbin/run-cos-novnc
priority=40
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
